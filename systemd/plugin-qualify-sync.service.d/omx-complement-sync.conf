# After each successful plugin-qualify sync, queue the port-group complement, but only if it was enabled
# (`systemctl enable omx-complement-sync` is the opt-in; the package never makes it), as omx-modgui-sync.conf here
# queues the GUI sync. The leading '-' keeps a missing systemctl or a disabled unit from failing the scan.
[Service]
ExecStartPost=-/bin/sh -c 'systemctl is-enabled -q omx-complement-sync.service && systemctl start --no-block omx-complement-sync.service'
