name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # the private development copy runs on FreeMixer's own runners (hosted runners are refused there); the public
    # repository runs on GitHub's. The suite reads the installed vocabulary (omx-contract's schema, plugin-hostd's LV2
    # table, the param-contract header), so it runs on Fedora with the OpenMixer channel, as the RPM's %check does.
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || 'ubuntu-latest' }}
    container:
      image: fedora:44
    steps:
      - name: Install node
        run: |
          dnf install -y --setopt=install_weak_deps=False git make nodejs npm dnf5-plugins
      - name: Add the OpenMixer repository
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - name: Install the vocabulary the suite reads
        run: |
          dnf install -y --setopt=install_weak_deps=False 'omx-contract-data >= 3.3.0' 'omx-plugins-contract >= 0.15.0'
          # plugin-hostd's LV2 table: plugin-hostd-contract from 0.12.0; plugin-hostd-devel installs the same file before it
          dnf install -y --setopt=install_weak_deps=False 'plugin-hostd-contract >= 0.12.0' \
            || dnf install -y --setopt=install_weak_deps=False plugin-hostd-devel
      - uses: actions/checkout@v4
      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: handback-install
        name: Install the build and the validator's dependency
        run: npm ci
      - id: handback-test
        name: Tests over the built tree (the layout, the MOD GUI, the look, the skin facts and schema, the importer, the command)
        run: make test
      - id: handback-spdx
        name: Every tracked file carries the licence and copyright lines
        run: make spdx
      - id: handback-public-sources
        name: No tracked file points into a private repository, branch, issue or path
        run: make public-sources
      - id: handback-look
        name: look.json is what the token cascade resolves to
        run: make look
      - id: handback-example
        name: The example skin package validates
        run: node dist/bin/omx-panel.mjs validate examples/skins/org.example.plate

  # The packages as a runtime install takes them: built from the checkout, installed in a clean container from the
  # channel with weak dependencies off, no -devel (-dev) package arrives and `omx-panel vocabulary` reads the installed
  # contract data (tools/runtime-install-check.sh). The suite is the test job's, so the builds skip it.
  packages:
    name: build the RPM and the DEB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The source tarball the spec names
        run: |
          v=$(sed -n 's/^Version: *//p' packaging/omx-panel.spec)
          mkdir -p src
          git archive --format=tar.gz --prefix="omx-panel-$v/" -o "src/omx-panel-$v.tar.gz" HEAD
      # --nodeps: the build itself needs node, npm and make; the contract packages %check reads are the test job's
      - name: The RPM (fedora:44)
        run: |
          docker run --rm -v "$PWD:/w" -w /w fedora:44 bash -euo pipefail -c '
            dnf install -y -q --setopt=install_weak_deps=False rpm-build make sed nodejs npm
            mkdir -p ~/rpmbuild/SOURCES out && cp src/*.tar.gz ~/rpmbuild/SOURCES/
            rpmbuild -bb --nocheck --nodeps packaging/omx-panel.spec
            cp ~/rpmbuild/RPMS/noarch/omx-panel-*.rpm out/'
      - name: The DEB (bookworm)
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends dpkg-dev debhelper nodejs npm make ca-certificates
            mkdir -p /b && tar -xzf src/*.tar.gz -C /b && cd /b/omx-panel-*
            DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -b -us -uc -d
            cp /b/omx-panel_*.deb /w/out/'
      - uses: actions/upload-artifact@v4
        with:
          name: omx-panel-packages
          path: out/
          if-no-files-found: error
          retention-days: 7

  runtime-install:
    name: runtime install (${{ matrix.image }})
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm']
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: omx-panel-packages
          path: out
      - name: The OpenMixer repository
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - name: Installed with weak dependencies off, no development package arrives and omx-panel reads the contract data
        run: |
          if command -v dnf >/dev/null; then pkg=$(ls out/omx-panel-*.noarch.rpm); else pkg=$(ls out/omx-panel_*_all.deb); fi
          bash tools/runtime-install-check.sh "$PWD/$pkg"

  # A commit message is published like a file. A pull request's own commits must carry no
  # AI-attribution line (tools/ai-trace-commit-check.sh); what is already on the base is not read.
  ai-trace:
    name: commit messages carry no AI attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: The checker catches a fixture and goes blind when its patterns are removed
        run: tools/ai-trace-commit-check.sh --selftest
      - name: Scan the commits of the pull request
        run: tools/ai-trace-commit-check.sh origin/${{ github.event.pull_request.base.ref }}..HEAD
