# omx-modgui-sync: one KEY=value per line, read by omx-modgui-sync.service as its EnvironmentFile.
# The defaults are the ones shown; uncomment to change one.
#
# the generated MOD GUI bundles; MOD-UI shows them once this directory is on its LV2_PATH
#MODGUI_DIR=/var/lib/omx/modgui
# the scans and work files
#STATE_DIR=/var/lib/omx/modgui-sync
# the scanned descriptors, a ':' list (plugin-hostd and plugin-qualify write /var/lib/omx/descriptors)
#DESCRIPTOR_DIRS=/var/lib/omx/descriptors
# the LV2 directories to look for plugins in (lilv's default when unset)
#LV2_PATH=
