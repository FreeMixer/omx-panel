# omx-modgui-sync: one KEY=value per line, read by omx-modgui-sync.service as its EnvironmentFile.
# The defaults are the ones shown; uncomment to change one.
#
# the generated MOD GUI bundles; MOD-UI shows them once this directory is on the LV2_PATH it reads
# (`omx-modgui-sync --check` says whether it is). The folder may also hold plugins.
#MODGUI_DIR=/usr/local/lib/lv2
# the scans and work files
#STATE_DIR=/var/lib/omx/modgui-sync
# the scanned descriptors, a ':' list (plugin-hostd and plugin-qualify write /var/lib/omx/descriptors)
#DESCRIPTOR_DIRS=/var/lib/omx/descriptors
# the LV2 search list; unset, plugin-hostd's default, which plugin-hostd and plugin-qualify read too
#LV2_PATH=/usr/lib64/lv2:/usr/lib/lv2:/usr/local/lib/lv2
